org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Pub cache (C:) y proyecto (D:) en unidades distintas: la compilacion incremental
# de Kotlin no puede relativizar rutas entre raices diferentes y rompe el daemon.
kotlin.incremental=false
android.useAndroidX=true
android.enableJetifier=true
# AGP 9 con los mismos flags que la plantilla de Flutter 3.47: el plugin de
# Gradle de Flutter aun no soporta newDsl=true, y builtInKotlin=true lo
# requiere. Con builtInKotlin=false cada plugin aplica KGP (Flutter lo aplica
# a los que no lo declaran). file_picker debe ser 13+: la 11 omitia KGP bajo
# AGP 9 y su codigo Kotlin no se compilaba.
android.builtInKotlin=false
android.newDsl=false
