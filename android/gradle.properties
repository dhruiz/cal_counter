org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Pub cache (C:) y proyecto (D:) en unidades distintas: la compilacion incremental
# de Kotlin no puede relativizar rutas entre raices diferentes y rompe el daemon.
kotlin.incremental=false
android.useAndroidX=true
android.enableJetifier=true
# Flutter 3.44 aun no soporta newDsl=true (su plugin de Gradle falla), y
# builtInKotlin=true lo requiere; ademas builtInKotlin exige AGP 9, donde
# file_picker 11 deja de aplicar KGP. Mantener false/false y AGP 8.x hasta
# que Flutter soporte el DSL nuevo.
android.builtInKotlin=false
android.newDsl=false
